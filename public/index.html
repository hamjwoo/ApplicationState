<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ApplicationState</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 720px;
    }
    th, td {
      text-align: left;
      padding: 6px 12px;
      border-bottom: 1px solid #ddd;
    }
    th {
      color: #555;
      font-size: 0.9em;
    }
    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot.running {
      background: #2e7d32;
    }
    .status-dot.closed {
      background: #c62828;
    }
    tr.alert {
      color: #b00020;
      font-weight: bold;
    }
    #demo-button {
      margin: 8px 0 16px;
      padding: 6px 14px;
      cursor: pointer;
    }
    #demo-button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 12px;
    }
    .tab-button {
      padding: 8px 16px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1em;
      color: #555;
      border-bottom: 2px solid transparent;
    }
    .tab-button.active {
      color: #1565c0;
      border-bottom-color: #1565c0;
      font-weight: bold;
    }
    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }
  </style>
</head>
<body>
  <h1>ApplicationState</h1>
  <button id="demo-button">테스트</button>
  <div id="demo-status"></div>
  <div class="tabs">
    <button class="tab-button active" data-tab="status">상태</button>
    <button class="tab-button" data-tab="history">이력</button>
  </div>
  <div id="tab-status" class="tab-panel active">
    <table id="app-table">
      <thead>
        <tr>
          <th>이름</th>
          <th>상태</th>
          <th>비고</th>
        </tr>
      </thead>
      <tbody id="app-list"></tbody>
    </table>
  </div>
  <div id="tab-history" class="tab-panel">
    <table id="history-table">
      <thead>
        <tr>
          <th>시간</th>
          <th>이름</th>
          <th>이전 상태</th>
          <th>이후 상태</th>
        </tr>
      </thead>
      <tbody id="history-list"></tbody>
    </table>
  </div>
  <script src="app.js"></script>
</body>
</html>
